packages:
  - packages/*

linkWorkspacePackages: true
preferWorkspacePackages: true

# Only install versions published at least a day ago. playcanvas is
# first-party, so engine updates are exempt and install as soon as released.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - playcanvas

# pnpm 11+ fails the install unless each install script is explicitly allowed or denied.
allowBuilds:
  esbuild: false
  unrs-resolver: false
